name: StrumKit
options:
  bundleIdPrefix: com.strumkit
  deploymentTarget:
    iOS: "17.0"
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  StrumKit:
    type: application
    platform: iOS
    sources:
      - path: StrumKit
    settings:
      base:
        PRODUCT_NAME: StrumKit
        PRODUCT_BUNDLE_IDENTIFIER: com.strumkit.tuner
        INFOPLIST_FILE: StrumKit/App/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_ALLOWED: NO

  StrumKitTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: StrumKitTests
    dependencies:
      - target: StrumKit
    settings:
      base:
        PRODUCT_NAME: StrumKitTests
        PRODUCT_BUNDLE_IDENTIFIER: com.strumkit.tunerTests
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_ALLOWED: NO
        # The test target is built -O, the app target stays -Onone.
        #
        # Not a preference. At -Onone the suite takes ~276 s and the test host is killed
        # by a watchdog partway through, which xcodebuild reports as dozens of failing
        # tests that in fact never ran. At -O the same suite finishes in ~2.5 s with
        # byte-identical output (5200-line traces, diff clean) — measured in
        # docs/tuner-reliability/RESULTS.md section 11, "Build configuration".
        #
        # Override for a genuine unoptimized debug run with:
        #   make test SLOW=1
        SWIFT_OPTIMIZATION_LEVEL: "-O"
